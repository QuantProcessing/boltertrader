openapi: 3.1.0
info:
  title: Exchange Gateway Internal Authority API
  version: v1
security:
  - gatewayAdapterAuth: []
paths:
  /internal/v1/runtime/status:
    get: {operationId: getInternalRuntimeStatus, responses: {'200': {$ref: '#/components/responses/RuntimeStatus'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/runtime/readiness:
    get: {operationId: getInternalRuntimeReadiness, responses: {'200': {$ref: '#/components/responses/RuntimeReadiness'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/runtime/open-orders:
    get: {operationId: listInternalOpenOrders, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/runtime/positions:
    get: {operationId: listInternalPositions, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/runtime/uncertain-commands:
    get: {operationId: listInternalUncertainCommands, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/accounts/desired:
    get:
      operationId: listDesiredAccounts
      responses: {'200': {$ref: '#/components/responses/DesiredAccounts'}, default: {$ref: '#/components/responses/Error'}}
  /internal/v1/accounts/desired/{accountId}:
    get:
      operationId: getDesiredAccount
      parameters: [{$ref: '#/components/parameters/AccountID'}]
      responses: {'200': {$ref: '#/components/responses/RuntimeView'}, '404': {$ref: '#/components/responses/Error'}, default: {$ref: '#/components/responses/Error'}}
  /internal/v1/accounts/desired/{accountId}/operations/{operationId}:
    put:
      operationId: applyDesiredAccount
      parameters: [{$ref: '#/components/parameters/AccountID'}, {$ref: '#/components/parameters/OperationID'}]
      requestBody: {$ref: '#/components/requestBodies/DesiredApply'}
      responses: {'200': {$ref: '#/components/responses/RuntimeView'}, '202': {$ref: '#/components/responses/RuntimeView'}, '409': {$ref: '#/components/responses/Error'}, default: {$ref: '#/components/responses/Error'}}
  /internal/v1/accounts/desired/{accountId}/retirements/{operationId}:
    put:
      operationId: retireDesiredAccount
      parameters: [{$ref: '#/components/parameters/AccountID'}, {$ref: '#/components/parameters/OperationID'}]
      requestBody: {$ref: '#/components/requestBodies/RetireAccount'}
      responses: {'200': {$ref: '#/components/responses/RuntimeView'}, '202': {$ref: '#/components/responses/RuntimeView'}, '409': {$ref: '#/components/responses/Error'}, default: {$ref: '#/components/responses/Error'}}
  /internal/v1/accounts/runtime:
    get: {operationId: listRuntimeAccounts, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/accounts/runtime/{accountId}:
    get:
      operationId: getRuntimeAccount
      parameters: [{$ref: '#/components/parameters/AccountID'}]
      responses: {'200': {$ref: '#/components/responses/RuntimeView'}, default: {$ref: '#/components/responses/Error'}}
  /internal/v1/accounts/runtime/{accountId}/events:
    get:
      operationId: listRuntimeAccountEvents
      parameters: [{$ref: '#/components/parameters/AccountID'}]
      responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}
  /internal/v1/catalog/venues:
    get: {operationId: listInternalVenues, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/catalog/instruments:
    get: {operationId: listInternalInstruments, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/browser/catalog/venues:
    get: {operationId: listBrowserVenues, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/browser/catalog/instruments:
    get: {operationId: listBrowserInstruments, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/browser/market-data:
    get: {operationId: getBrowserMarketData, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/browser/candles:
    get: {operationId: getBrowserCandles, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/browser/funding-history:
    get: {operationId: getBrowserFundingHistory, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/market-data:
    get: {operationId: getInternalMarketData, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/candles:
    get: {operationId: getInternalCandles, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/market/ws:
    get:
      operationId: streamInternalMarket
      responses:
        '101':
          description: Multiplexed Gateway market stream. Topics start from a WebSocket-derived snapshot; order books then carry native deltas or self-contained full replacements. No REST book is joined to the stream. Gaps emit resync_required and reopen the logical subscription with a new generation. Control frames use subscribe, unsubscribe, and ping.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealtimeMessage'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/account/ws:
    get:
      operationId: streamInternalAccountEvents
      responses:
        '101':
          description: Live Gateway account change notifications. The client reads authoritative REST snapshots after each checkpoint or reconnect; no account event replay or venue sequence is required.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealtimeMessage'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/market-facts:
    get: {operationId: getInternalMarketFacts, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/fresh-bbo:
    get: {operationId: getInternalFreshBBO, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/private-events:
    get: {operationId: listInternalPrivateEvents, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/funding-board:
    get: {operationId: getInternalFundingBoard, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/funding-history:
    get: {operationId: getInternalFundingHistory, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
  /internal/v1/venues/connectivity:
    get: {operationId: getInternalVenueConnectivity, responses: {'200': {$ref: '#/components/responses/RuntimeFacts'}, default: {$ref: '#/components/responses/Error'}}}
components:
  securitySchemes:
    gatewayAdapterAuth: {type: http, scheme: bearer}
  parameters:
    AccountID: {name: accountId, in: path, required: true, schema: {type: string, minLength: 1}}
    OperationID: {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    DesiredApply: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DesiredApplyRequest'}}}}
    RetireAccount: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RetireRequest'}}}}
  responses:
    RuntimeStatus:
      description: detailed runtime status
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties: {data: {$ref: '#/components/schemas/RuntimeStatus'}}
    RuntimeReadiness:
      description: runtime readiness derived from authoritative runtime accounts
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties: {data: {$ref: '#/components/schemas/RuntimeReadiness'}}
    DesiredRuntime: {description: redacted desired runtime, content: {application/json: {schema: {$ref: '#/components/schemas/DesiredRuntimeView'}}}}
    DesiredAccounts: {description: desired accounts, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DesiredRuntimeView'}}}}}
    RuntimeView:
      description: redacted runtime truth
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties: {data: {$ref: '#/components/schemas/RuntimeView'}}
    RuntimeFacts: {description: redacted product-agnostic authority facts, content: {application/json: {schema: {type: object}}}}
    Error: {description: stable redacted error, content: {application/json: {schema: {$ref: '#/components/schemas/InternalErrorEnvelope'}}}}
  schemas:
    RealtimeMessage:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [ack, snapshot, delta, full, checkpoint, resync_required, error, pong]}
        requestId: {type: string}
        subscriptionId: {type: string}
        topic: {type: string, enum: [market.order_book, market.bbo, market.candles, market.mark_price, funding.board, system.venue_connectivity]}
        generation: {type: integer, minimum: 0}
        sequence: {type: integer, minimum: 0}
        sourceSequence: {type: string}
        observedAt: {type: string, format: date-time}
        data: {type: object}
        code: {type: string}
        reason: {type: string}
    RuntimeStatus:
      type: object
      additionalProperties: false
      required: [mode, accounts]
      properties:
        mode: {type: string, enum: [test, live]}
        accounts: {type: array, items: {type: object}}
    RuntimeReadiness:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready: {type: boolean}
    DesiredRoute:
      type: object
      additionalProperties: false
      required: [routeId, product, routeProfileId, requestedState]
      properties:
        routeId: {type: string, minLength: 1}
        product: {type: string, enum: [spot, perp]}
        settlementAsset: {type: string}
        routeProfileId: {type: string, minLength: 1}
        requestedState: {type: string, enum: [active, disabled]}
    DesiredApplyRequest:
      type: object
      additionalProperties: false
      required: [operationId, accountId, runtimeId, venue, nativeEnvironment, secretRef, requestedState, routes]
      properties:
        operationId: {type: string, format: uuid}
        accountId: {type: string, minLength: 1}
        runtimeId: {type: string, format: uuid}
        venue: {type: string, minLength: 1}
        nativeEnvironment: {type: string, enum: [demo, testnet, live]}
        secretRef: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: opaque reference; never credential material}
        requestedState: {type: string, enum: [creating, active, disabled, removing, removed]}
        routes: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/DesiredRoute'}}
    WriteFence:
      type: object
      additionalProperties: false
      required: [accountId, routeId, runtimeId]
      properties:
        accountId: {type: string, minLength: 1}
        routeId: {type: string, minLength: 1}
        runtimeId: {type: string, format: uuid}
    RetireRequest:
      type: object
      additionalProperties: false
      required: [operationId, accountId, runtimeId]
      properties:
        operationId: {type: string, format: uuid}
        accountId: {type: string, minLength: 1}
        runtimeId: {type: string, format: uuid}
    DesiredRuntimeView:
      type: object
      additionalProperties: false
      required: [accountId, requestedState, routes]
      properties:
        accountId: {type: string}
        requestedState: {type: string}
        routes: {type: array, items: {$ref: '#/components/schemas/DesiredRoute'}}
        active: {$ref: '#/components/schemas/RuntimeSnapshotView'}
        pending: {$ref: '#/components/schemas/PendingSnapshotView'}
    RuntimeView:
      type: object
      additionalProperties: false
      required: [accountId, retiring, tombstoned, readiness, writeReadiness, blockedReason, capabilities]
      allOf:
        - if:
            required: [active]
          then:
            required: [runtimeId, observedAt]
      properties:
        accountId: {type: string}
        active: {$ref: '#/components/schemas/RuntimeSnapshotView'}
        pending: {$ref: '#/components/schemas/PendingSnapshotView'}
        retiring: {type: array, items: {$ref: '#/components/schemas/RuntimeSnapshotView'}}
        tombstoned: {type: boolean}
        runtimeId: {type: string, format: uuid}
        readiness: {$ref: '#/components/schemas/RuntimeProjectionReadiness'}
        writeReadiness: {$ref: '#/components/schemas/RuntimeProjectionReadiness'}
        blockedReason: {type: [string, 'null']}
        capabilities: {type: array, items: {$ref: '#/components/schemas/RuntimeCapabilityView'}}
        observedAt: {type: string, format: date-time}
    RuntimeProjectionReadiness:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready: {type: boolean}
        reason: {type: string}
    RuntimeCapabilityView:
      type: object
      additionalProperties: false
      required: [rowId, venue, product, writeReady, operations]
      properties:
        rowId: {type: string}
        venue: {type: string}
        product: {type: string, enum: [spot, perp]}
        settlement: {type: string}
        writeReady: {type: boolean}
        operations: {$ref: '#/components/schemas/RuntimeCapabilityOperations'}
    RuntimeCapabilityOperations:
      type: object
      additionalProperties: false
      required: [place, amend, cancel, open_orders, order_history, fills, balances, account, positions, funding, account_funding_payments, leverage, private_stream, margin_mode, position_mode, funds_transfer]
      properties:
        place: {type: boolean}
        amend: {type: boolean}
        cancel: {type: boolean}
        open_orders: {type: boolean}
        order_history: {type: boolean}
        fills: {type: boolean}
        balances: {type: boolean}
        account: {type: boolean}
        positions: {type: boolean}
        funding: {type: boolean}
        account_funding_payments: {type: boolean}
        leverage: {type: boolean}
        private_stream: {type: boolean}
        margin_mode: {type: boolean}
        position_mode: {type: boolean}
        funds_transfer: {type: boolean}
    RouteRuntimeView:
      type: object
      additionalProperties: false
      required: [routeId, product, routeProfileId, requestedState, ready]
      properties:
        routeId: {type: string}
        product: {type: string, enum: [spot, perp]}
        settlementAsset: {type: string}
        routeProfileId: {type: string}
        requestedState: {type: string, enum: [active, disabled]}
        ready: {type: boolean}
        reason: {type: string}
    RuntimeSnapshotView:
      type: object
      additionalProperties: false
      required: [operationId, runtimeId, requestedState, routes]
      properties:
        operationId: {type: string, format: uuid}
        runtimeId: {type: string, format: uuid}
        requestedState: {type: string, enum: [creating, active, disabled, removing, removed]}
        routes: {type: array, items: {$ref: '#/components/schemas/RouteRuntimeView'}}
    PendingSnapshotView:
      type: object
      additionalProperties: false
      required: [operationId, runtimeId, requestedState, routes, state]
      properties:
        operationId: {type: string, format: uuid}
        runtimeId: {type: string, format: uuid}
        requestedState: {type: string, enum: [creating, active, disabled, removing, removed]}
        routes: {type: array, items: {$ref: '#/components/schemas/RouteRuntimeView'}}
        state: {type: string, enum: [prepared, candidate_ready, candidate_failed, applied]}
        reason: {type: string}
    InternalErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, retryable]
          properties:
            code: {type: string, enum: [ACCOUNT_RUNTIME_BLOCKED, CANDIDATE_NOT_READY, CREDENTIAL_EXPIRED, CREDENTIAL_INVALID, CREDENTIAL_PERMISSION_DENIED, DESIRED_ACCOUNT_NOT_FOUND, DESIRED_STATE_REVISION_CONFLICT, GATEWAY_ADAPTER_AUTH_REQUIRED, HANDOFF_DRAIN_BLOCKED, IF_MATCH_REQUIRED, IF_NONE_MATCH_REQUIRED, INTERNAL_ERROR, INVALID_ACCOUNT_TRANSITION, LIVE_PRIVATE_WRITE_DISABLED, OPERATION_ID_CONFLICT, PROMOTION_FENCE_CONFLICT, RETIRED_SECRET_REFERENCE, STALE_RUNTIME_FENCE, VALIDATION_ERROR, VENUE_RATE_LIMITED, VENUE_RESPONSE_INVALID, VENUE_UNAVAILABLE]}
            message: {type: string}
            requestId: {type: string}
            retryable: {type: boolean}
            details: {type: object}
