openapi: 3.1.0
info:
  title: Exchange Gateway API
  version: v1
security:
  - bearerAuth: []
paths:
  /v1/market/instruments:
    get:
      operationId: listMarketInstruments
      description: Account-independent public catalog. Requires the Gateway bearer token. No query parameters. A partial or stale catalog has complete=false; unavailable_profiles names omitted scopes and each item carries directory readiness. Omission is not proof of delisting.
      responses:
        '200': {description: public instrument directory, content: {application/json: {schema: {$ref: '#/components/schemas/MarketCatalogResponse'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/market/candles:
    get:
      operationId: getMarketCandles
      description: Reads bounded public candle history without an account. Use an opaque instrument_id returned by the public catalog; do not construct native symbols. Decimal values are strings.
      parameters:
        - {name: instrument_id, in: query, required: true, schema: {type: string}}
        - {name: interval, in: query, required: true, schema: {type: string, enum: [1m, 5m, 15m, 30m, 1h, 4h, 12h, 1d]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: public candles, content: {application/json: {schema: {$ref: '#/components/schemas/MarketCandlesResponse'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/market/snapshot:
    get:
      operationId: getMarketSnapshot
      description: Returns the first complete snapshot of the same Market Hub topic used by WebSocket consumers, then releases the logical subscription. A gap or unavailable snapshot returns 503, never an empty successful book. The original observedAt is preserved; an HTTP 200 alone is not a freshness guarantee.
      parameters:
        - {name: instrument_id, in: query, required: true, schema: {type: string}}
        - {name: topic, in: query, required: true, schema: {type: string, enum: [market.order_book, market.bbo, market.candles, market.mark_price]}}
        - {name: depth, in: query, description: Required only for market.order_book; forbidden for other topics., schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: interval, in: query, description: Required only for market.candles; forbidden for other topics., schema: {type: string, enum: [1m, 5m, 15m, 30m, 1h, 4h, 12h, 1d]}}
      responses:
        '200': {description: account-independent shared snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/MarketSnapshotResponse'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/market/ws:
    get:
      operationId: streamPublicMarkets
      description: |
        Account-independent market subscriptions authenticated by the Authorization Bearer header; query tokens and query parameters are rejected. Control messages use MarketControl. Supports at most 64 active subscriptions and 64 topics per control, with a 64 KiB control limit. Does not expose account.events, funding.board, connectivity, cursor replay, or protected internalPurpose priorities.
        An ack allocates a subscription ID; data readiness begins at snapshot. Keep separate state per subscriptionId and generation. Snapshot replaces state, delta mutates it, and full replaces the current visible book. Sequence is local to the shared topic and generation; sourceSequence is an opaque venue token. Discard state on resync_required and wait for a new-generation snapshot. An upstream Hub gap keeps the subscription alive and resnapshots automatically. UPSTREAM_UNAVAILABLE is terminal for that subscription: resubscribe with bounded backoff. INSTRUMENT_UNKNOWN and UNSUPPORTED_TOPIC are terminal error messages. A socket disconnect, including consumer lag, requires reconnecting and resubscribing; the final resync message may not arrive. There is no persistent replay across sessions or process restarts.
        Market snapshots and updates use the existing camelCase realtime envelope. REST query parameters use snake_case. Order-book quantities are strings; zero quantity in a delta removes that price level. BBO updates replace the entire best quote and may have increasing but non-contiguous sequence numbers because Gateway coalesces high-frequency updates. Order-book deltas require contiguous sequences within a generation. Candle snapshots contain candles, while updates contain candle keyed by openTime. Mark updates replace the current price. Consumers must track data freshness separately from pong/control liveness.
      x-control-schema: {$ref: '#/components/schemas/MarketControl'}
      responses:
        '101': {description: market WebSocket upgraded, content: {application/json: {schema: {$ref: '#/components/schemas/MarketMessage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/health/live:
    get: {operationId: getLiveHealth, responses: {'200': {description: live}}}
  /v1/health/ready:
    get: {operationId: getReadyHealth, responses: {'200': {description: ready}}}
  /v1/accounts:
    get:
      operationId: listAccounts
      parameters: [{$ref: '#/components/parameters/PaginationLimit'}]
      responses: {'200': {description: accounts}, default: {$ref: '#/components/responses/Error'}}
  /v1/accounts/{account_id}:
    get:
      operationId: getAccount
      parameters: [{name: account_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: account}}
  /v1/capabilities:
    get:
      operationId: listCapabilities
      parameters: [{name: account_id, in: query, schema: {type: string}}]
      responses: {'200': {description: capabilities}, default: {$ref: '#/components/responses/Error'}}
  /v1/instruments:
    get:
      operationId: listInstruments
      parameters:
        - {name: account_id, in: query, schema: {type: string}}
        - {name: venue, in: query, schema: {type: string}}
        - {name: product, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/PaginationLimit'}
      responses: {'200': {description: instruments}, default: {$ref: '#/components/responses/Error'}}
  /v1/instruments/{instrument_id}:
    get:
      operationId: getInstrument
      parameters: [{name: instrument_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: instrument}}
  /v1/rules:
    get:
      operationId: listRules
      parameters: [{name: account_id, in: query, schema: {type: string}}]
      responses: {'200': {description: rules}, default: {$ref: '#/components/responses/Error'}}
  /v1/risk-limits:
    get:
      operationId: listRiskLimits
      parameters: [{name: account_id, in: query, schema: {type: string}}]
      responses: {'200': {description: risk limits}, default: {$ref: '#/components/responses/Error'}}
  /v1/orders:
    post:
      operationId: placeOrder
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlaceOrderRequest'}
      responses:
        '202': {description: accepted, content: {application/json: {schema: {$ref: '#/components/schemas/OrderResponse'}}}}
        '409': {description: idempotency conflict, content: {application/json: {schema: {$ref: '#/components/schemas/IdempotencyConflict'}}}}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listOrders
      parameters:
        - {name: account_id, in: query, schema: {type: string}}
        - {name: instrument_id, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/PaginationLimit'}
        - {$ref: '#/components/parameters/PaginationCursor'}
      responses: {'200': {description: orders}, default: {$ref: '#/components/responses/Error'}}
  /v1/orders/by-idempotency-key/{idempotency_key}:
    get:
      operationId: getOrderByIdempotencyKey
      description: Reads a durable order using the original placement key, scoped to the authenticated principal. Never dispatches an order. A 404 is not proof that an in-flight placement cannot subsequently be recorded.
      parameters: [{name: idempotency_key, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: order and lookup scope, content: {application/json: {schema: {$ref: '#/components/schemas/OrderLookupResponse'}}}}
        '404': {description: no order currently recorded for this principal and key}
        default: {$ref: '#/components/responses/Error'}
  /v1/orders/{gateway_order_id}:
    get:
      operationId: getOrder
      parameters: [{name: gateway_order_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: order}}
    patch:
      operationId: amendOrder
      description: Reserved operation. Amendment is unsupported and returns 501 without accepting an amendment payload.
      parameters: [{name: gateway_order_id, in: path, required: true, schema: {type: string}}]
      responses: {'501': {description: unsupported capability}, default: {$ref: '#/components/responses/Error'}}
    delete:
      operationId: cancelOrder
      description: Cancels the principal-owned Gateway order by its durable identity. No request body or caller-supplied account/runtime fence is required; routing comes from the stored order.
      parameters: [{name: gateway_order_id, in: path, required: true, schema: {type: string}}]
      responses: {'202': {description: cancel accepted}, default: {$ref: '#/components/responses/Error'}}
  /v1/open-orders:
    get:
      operationId: listOpenOrders
      parameters:
        - {name: account_id, in: query, schema: {type: string}}
        - {name: instrument_id, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/PaginationLimit'}
        - {$ref: '#/components/parameters/PaginationCursor'}
      responses: {'200': {description: open orders}, default: {$ref: '#/components/responses/Error'}}
  /v1/fills:
    get:
      operationId: listFills
      parameters:
        - {name: account_id, in: query, schema: {type: string}}
        - {name: instrument_id, in: query, schema: {type: string}}
        - name: gateway_order_id
          in: query
          schema: {type: string}
          description: Optional Gateway order UUID. When present, the gateway verifies ownership, checks any account_id/instrument_id query scope against the stored order identity, maps to the internal venue order id, and returns only fills for that order. Venue order ids are never exposed by this filter.
        - {$ref: '#/components/parameters/PaginationLimit'}
        - {$ref: '#/components/parameters/PaginationCursor'}
      responses:
        '200':
          description: 'Fills. Each item carries product, base_asset, and settlement_asset from the resolved instrument. fill.fee is a signed cost in fill.fee_asset (positive charge, negative rebate). The fill.fill_id is venue-native and scoped by account_id and instrument_id; consumers must use all three fields for deduplication. next_cursor is present only when the venue page proves a known continuation.'
        default: {$ref: '#/components/responses/Error'}
  /v1/balances:
    get:
      operationId: listBalances
      description: Complete non-zero balances across selected routes, read sequentially. No pagination or atomic cross-venue snapshot is implied. More than 10000 rows returns BALANCE_SNAPSHOT_TOO_LARGE instead of a partial success.
      parameters:
        - {name: account_id, in: query, schema: {type: string}}
      responses:
        '200':
          description: Complete balance snapshot
          content:
            application/json:
              schema:
                type: object
                required: [items, complete]
                properties:
                  complete: {type: boolean, const: true}
                  items: {type: array, maxItems: 10000, items: {type: object}}
        default: {$ref: '#/components/responses/Error'}
  /v1/positions:
    get:
      operationId: listPositions
      parameters:
        - {name: account_id, in: query, schema: {type: string}}
        - {name: instrument_id, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/PaginationLimit'}
      responses: {'200': {description: positions}, default: {$ref: '#/components/responses/Error'}}
  /v1/position-snapshot:
    get:
      operationId: getPositionSnapshot
      description: Returns a complete account position projection. An empty items array proves no positions only when this request succeeds; concurrent stream changes are merged by entity observation time.
      parameters:
        - {name: account_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: complete account position snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PositionSnapshotResponse'}
        default: {$ref: '#/components/responses/Error'}
  /v1/funding-payments:
    get:
      operationId: listFundingPayments
      parameters:
        - {name: account_id, in: query, required: true, schema: {type: string}}
        - {name: instrument_id, in: query, schema: {type: string}}
        - {name: settlement_asset, in: query, schema: {type: string}}
        - {name: start, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: end, in: query, required: true, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/PaginationLimit'}
        - {$ref: '#/components/parameters/PaginationCursor'}
      responses:
        '200':
          description: account-scoped actual signed funding-payment facts; unsupported and incomplete states are explicit and never inferred as zero
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FundingPaymentPage'}
        default: {$ref: '#/components/responses/Error'}
  /v1/funding-rates:
    get:
      operationId: listFundingRates
      parameters:
        - {name: account_id, in: query, required: true, schema: {type: string}}
        - {name: instrument_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: normalized current funding rate with venue-native identifiers redacted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FundingRateResponse'}
        default: {$ref: '#/components/responses/Error'}
  /v1/funding-rates/history:
    get:
      operationId: listFundingRateHistory
      parameters:
        - {name: account_id, in: query, required: true, schema: {type: string}}
        - {name: instrument_id, in: query, required: true, schema: {type: string}}
        - {name: start, in: query, schema: {type: string, format: date-time}}
        - {name: end, in: query, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/PaginationLimit'}
        - {$ref: '#/components/parameters/PaginationCursor'}
      responses:
        '200':
          description: account-scoped normalized funding history with an opaque continuation cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FundingHistoryProjection'}
        default: {$ref: '#/components/responses/Error'}
  /v1/order-book:
    get:
      operationId: getOrderBook
      parameters:
        - {name: account_id, in: query, required: true, schema: {type: string}}
        - {name: instrument_id, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 20}}
      responses:
        '200':
          description: account-scoped normalized order-book snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderBookProjection'}
        default: {$ref: '#/components/responses/Error'}
  /v1/bbo:
    get:
      operationId: getBBO
      parameters:
        - {name: account_id, in: query, required: true, schema: {type: string}}
        - {name: instrument_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: account-scoped normalized two-sided best bid and offer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BBOProjection'}
        default: {$ref: '#/components/responses/Error'}
  /v1/mark-price:
    get:
      operationId: getMarkPrice
      parameters:
        - {name: account_id, in: query, required: true, schema: {type: string}}
        - {name: instrument_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: account-scoped normalized positive mark price
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarkPriceProjection'}
        default: {$ref: '#/components/responses/Error'}
  /v1/candles:
    get:
      operationId: getCandles
      parameters:
        - {name: account_id, in: query, required: true, schema: {type: string}}
        - {name: instrument_id, in: query, required: true, schema: {type: string}}
        # The enum is the venue-neutral vocabulary, not a passthrough. Venues
        # disagree on spelling (OKX writes 1H/1D, Binance 1h/1d), so accepting
        # the native form would make a caller's interval depend on which venue
        # the instrument happens to live on.
        - {name: interval, in: query, required: true, schema: {type: string, enum: [1m, 5m, 15m, 30m, 1h, 4h, 12h, 1d]}}
        - {name: start, in: query, schema: {type: string, format: date-time}}
        - {name: end, in: query, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/PaginationLimit'}
        - {$ref: '#/components/parameters/PaginationCursor'}
      responses:
        '200':
          description: account-scoped normalized OHLCV bars in ascending open-time order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandlesProjection'}
        default: {$ref: '#/components/responses/Error'}
  /v1/accounts/{account_id}/instruments/{instrument_id}/leverage:
    put:
      operationId: setLeverage
      parameters:
        - {name: account_id, in: path, required: true, schema: {type: string}}
        - {name: instrument_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leverage]
              additionalProperties: false
              properties:
                leverage: {type: integer, minimum: 1}
      responses: {'501': {description: durable leverage commands are not supported in Gateway V1}, default: {$ref: '#/components/responses/Error'}}
  /v1/ws:
    get:
      operationId: streamPrivateEvents
      parameters:
        - {name: account_id, in: query, required: true, schema: {type: string}}
        - name: kind
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {type: string, enum: [order, fill, balance, position, account_connection]}
      responses:
        '101':
          description: private event stream; each server message is a PrivateEvent
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    PaginationLimit:
      name: pagination.limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500}
    PaginationCursor:
      name: pagination.cursor
      in: query
      schema: {type: string}
  responses:
    Error:
      description: stable error envelope
      headers:
        Retry-After:
          description: Optional delay in whole seconds for HTTP 429. Does not authorize automatic order resubmission.
          schema: {type: string, pattern: '^[0-9]+$'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    MarketInstrument:
      type: object
      additionalProperties: true
      required: [instrument_id, route_profile_id, venue, environment, product, settlement, symbol, base_asset, quote_asset, ready]
      properties:
        instrument_id: {type: string, description: Opaque stable Gateway identity; URL-encode when used in a query.}
        route_profile_id: {type: string}
        venue: {type: string}
        environment: {type: string, enum: [live]}
        product: {type: string, enum: [spot, perp]}
        settlement: {type: string}
        symbol: {type: string}
        base_asset: {type: string}
        quote_asset: {type: string}
        ready: {type: boolean, description: Directory freshness only; not a promise of live market-data freshness.}
    MarketCatalogResponse:
      type: object
      additionalProperties: true
      required: [revision, observed_at, complete, unavailable_profiles, items]
      properties:
        revision: {type: string}
        observed_at: {type: string, format: date-time, description: Oldest contributing catalog observation; not response generation time.}
        complete: {type: boolean}
        unavailable_profiles: {type: array, items: {type: string}}
        items: {type: array, items: {$ref: '#/components/schemas/MarketInstrument'}}
    MarketCandlesResponse:
      type: object
      additionalProperties: true
      required: [instrument_id, interval, candles, page]
      properties:
        instrument_id: {type: string}
        interval: {type: string}
        candles: {type: array, items: {$ref: '#/components/schemas/Candle'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    MarketSnapshotResponse:
      type: object
      additionalProperties: true
      required: [instrument_id, snapshot]
      properties:
        instrument_id: {type: string}
        snapshot: {$ref: '#/components/schemas/MarketMessage'}
    MarketControl:
      type: object
      required: [op, requestId]
      description: subscribe requires topics; unsubscribe requires subscriptionId on each item; ping has no topics. A rejected subscription batch allocates no subscriptions. Unknown fields have no effect; cursor and internalPurpose are rejected when nonempty.
      properties:
        op: {type: string, enum: [subscribe, unsubscribe, ping]}
        requestId: {type: string, minLength: 1}
        topics: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/MarketTopicRequest'}}
    MarketTopicRequest:
      type: object
      description: For subscribe, topic and instrumentId are required and subscriptionId must be absent. depth is required only for order_book; interval only for candles. For unsubscribe, subscriptionId is required.
      properties:
        subscriptionId: {type: string}
        topic: {type: string, enum: [market.order_book, market.bbo, market.candles, market.mark_price]}
        instrumentId: {type: string}
        depth: {type: integer, minimum: 1, maximum: 100}
        interval: {type: string, enum: [1m, 5m, 15m, 30m, 1h, 4h, 12h, 1d]}
    MarketMessage:
      type: object
      additionalProperties: true
      required: [type]
      properties:
        type: {type: string, enum: [ack, snapshot, delta, full, resync_required, error, pong]}
        requestId: {type: string}
        subscriptionId: {type: string}
        topic: {type: string, enum: [market.order_book, market.bbo, market.candles, market.mark_price]}
        generation: {type: integer, minimum: 1, description: Present on Hub data and gap messages; scoped to this live subscription, not a durable epoch.}
        sequence: {type: integer, minimum: 1}
        sourceSequence: {type: string}
        observedAt: {type: string, format: date-time}
        data:
          oneOf:
            - type: object
              required: [bids, asks]
              properties:
                bids: {type: array, items: {$ref: '#/components/schemas/BookLevel'}}
                asks: {type: array, items: {$ref: '#/components/schemas/BookLevel'}}
                kind: {type: string, enum: [snapshot, delta, full]}
                previous: {type: string}
            - type: object
              required: [bid, ask]
              properties:
                bid: {$ref: '#/components/schemas/BookLevel'}
                ask: {$ref: '#/components/schemas/BookLevel'}
            - type: object
              required: [interval]
              properties:
                interval: {type: string}
                candles: {type: array, items: {$ref: '#/components/schemas/MarketStreamCandle'}}
                candle: {$ref: '#/components/schemas/MarketStreamCandle'}
            - type: object
              required: [price, staleAfterMs, ageMs, receivedAt]
              properties:
                price: {type: string}
                staleAfterMs: {type: integer, minimum: 0}
                ageMs: {type: integer, minimum: 0, description: Age at serialization; continue aging locally after receipt.}
                receivedAt: {type: string, format: date-time, description: Original Gateway fact receipt time; unchanged on replay.}
        code: {type: string}
        reason: {type: string}
    MarketStreamCandle:
      type: object
      additionalProperties: true
      required: [openTime, closeTime, open, high, low, close, volume, complete]
      properties:
        openTime: {type: string, format: date-time}
        closeTime: {type: string, format: date-time}
        open: {type: string}
        high: {type: string}
        low: {type: string}
        close: {type: string}
        volume: {type: string}
        complete: {type: boolean}
    PlaceOrderRequest:
      type: object
      required: [account_id, route_id, instrument_id, idempotency_key, side, type, quantity, runtime_id]
      additionalProperties: false
      example:
        account_id: acct-a
        route_id: spot
        instrument_id: binance:live:spot:BTC-USDT
        idempotency_key: idem-1
        side: buy
        type: limit
        quantity: '0.001'
        limit_price: '100'
        limit_policy: resting
        reduce_only: false
        leverage: 0
        runtime_id: 018f47a8-2578-7d3c-9d7d-5e4f4a445e11
      properties:
        account_id: {type: string}
        route_id: {type: string}
        instrument_id: {type: string}
        idempotency_key: {type: string}
        side: {type: string, enum: [buy, sell]}
        type: {type: string, enum: [market, limit]}
        quantity: {type: string}
        limit_price: {type: string}
        limit_policy: {type: string, enum: [resting, ioc, post_only]}
        reduce_only: {type: boolean}
        leverage: {type: integer, minimum: 0, description: 'Optional perpetual leverage; zero leaves the current leverage unchanged.'}
        runtime_id: {type: string, minLength: 1, description: 'Runtime ownership fence obtained from the account. A stale runtime is rejected before venue dispatch.'}
    OrderLookupResponse:
      type: object
      additionalProperties: true
      required: [idempotency_key, account_id, instrument_id, order]
      properties:
        idempotency_key: {type: string}
        account_id: {type: string}
        instrument_id: {type: string}
        order: {$ref: '#/components/schemas/OrderResponse'}
    OrderResponse:
      type: object
      required: [command_id, gateway_order_id, client_order_id, account_id, instrument_id, state, resource_version]
      properties:
        command_id: {type: string}
        gateway_order_id: {type: string}
        client_order_id: {type: string}
        account_id: {type: string}
        instrument_id: {type: string}
        state: {type: string}
        resource_version: {type: integer, minimum: 1}
        venue_code: {type: string, description: Normalized venue rejection code when state is rejected.}
        venue_message: {type: string, description: Safe normalized rejection reason when state is rejected.}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id, retryable]
          properties:
            code: {type: string, enum: [OPERATION_ID_CONFLICT, ROUTE_PROFILE_CONFLICT, CANDIDATE_NOT_READY, PROMOTION_FENCE_CONFLICT, HANDOFF_DRAIN_BLOCKED, RETIRED_SECRET_REFERENCE, PRIVATE_STREAM_GAP, LIVE_WRITE_DISABLED]}
            message: {type: string}
            correlation_id: {type: string}
            retryable: {type: boolean}
    IdempotencyConflict:
      type: object
      required: [error, existing_command_id]
      properties:
        error:
          type: object
          required: [code, message, correlation_id, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            correlation_id: {type: string}
            retryable: {type: boolean}
        existing_command_id: {type: string}
    BookLevel:
      type: object
      required: [price, quantity]
      additionalProperties: false
      properties:
        price: {type: string, pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'}
        quantity: {type: string, pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'}
    PageInfo:
      type: object
      required: [has_more_known, has_more]
      additionalProperties: false
      properties:
        cursor: {type: string}
        limit: {type: integer, minimum: 0, maximum: 500}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        has_more_known: {type: boolean}
        has_more: {type: boolean}
    OptionalDecimal:
      type: object
      required: [value, valid]
      additionalProperties: false
      properties:
        value: {type: string, pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'}
        valid: {type: boolean}
    FundingRateProjection:
      type: object
      required: [rate, mark_price]
      additionalProperties: false
      properties:
        rate: {type: string, pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'}
        mark_price: {$ref: '#/components/schemas/OptionalDecimal'}
        observed_at: {type: string, format: date-time}
        funding_time: {type: string, format: date-time}
        next_funding_time: {type: string, format: date-time}
    FundingRateResponse:
      type: object
      required: [account_id, instrument_id, funding_rate]
      additionalProperties: false
      properties:
        account_id: {type: string}
        instrument_id: {type: string}
        funding_rate: {$ref: '#/components/schemas/FundingRateProjection'}
    OrderBookProjection:
      type: object
      required: [account_id, instrument_id, bids, asks, observed_at, page]
      additionalProperties: false
      properties:
        account_id: {type: string}
        instrument_id: {type: string}
        bids: {type: array, items: {$ref: '#/components/schemas/BookLevel'}}
        asks: {type: array, items: {$ref: '#/components/schemas/BookLevel'}}
        observed_at: {type: string, format: date-time}
        sequence: {type: string}
        page: {$ref: '#/components/schemas/PageInfo'}
    BBOProjection:
      type: object
      required: [account_id, instrument_id, bid, ask, observed_at]
      additionalProperties: false
      properties:
        account_id: {type: string}
        instrument_id: {type: string}
        bid: {$ref: '#/components/schemas/BookLevel'}
        ask: {$ref: '#/components/schemas/BookLevel'}
        observed_at: {type: string, format: date-time}
    MarkPriceProjection:
      type: object
      required: [account_id, instrument_id, price, observed_at]
      additionalProperties: false
      properties:
        account_id: {type: string}
        instrument_id: {type: string}
        price: {type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'}
        observed_at: {type: string, format: date-time}
    CandlesProjection:
      type: object
      required: [account_id, instrument_id, interval, candles, page]
      additionalProperties: false
      properties:
        account_id: {type: string}
        instrument_id: {type: string}
        interval: {type: string, enum: [1m, 5m, 15m, 30m, 1h, 4h, 12h, 1d]}
        candles: {type: array, items: {$ref: '#/components/schemas/Candle'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    Candle:
      type: object
      # Every field is always present on the wire: `omitempty` on a time.Time is
      # a no-op in encoding/json, so a venue that supplies no close time sends
      # the zero instant rather than omitting the key. Read a close_time of
      # 0001-01-01T00:00:00Z as "not reported", not as a real timestamp.
      required: [open_time, close_time, open, high, low, close, volume, complete]
      additionalProperties: false
      properties:
        open_time: {type: string, format: date-time}
        close_time: {type: string, format: date-time}
        open: {type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'}
        high: {type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'}
        low: {type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'}
        close: {type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'}
        volume: {type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'}
        # False on the newest bar of a live window: the interval is still open
        # and every field but open_time may still change.
        complete: {type: boolean}
    FundingHistoryProjection:
      type: object
      required: [account_id, instrument_id, items]
      additionalProperties: false
      properties:
        account_id: {type: string}
        instrument_id: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/FundingRateProjection'}}
        next_cursor: {type: string}
    CapabilityOperations:
      type: object
      additionalProperties: false
      properties:
        place: {type: boolean}
        amend: {type: boolean}
        cancel: {type: boolean}
        open_orders: {type: boolean}
        order_history: {type: boolean}
        fills: {type: boolean}
        balances: {type: boolean}
        account: {type: boolean}
        positions: {type: boolean}
        funding: {type: boolean}
        account_funding_payments: {type: boolean}
        leverage: {type: boolean}
        private_stream: {type: boolean}
        margin_mode: {type: boolean}
        position_mode: {type: boolean}
        funds_transfer: {type: boolean}
    FundingPayment:
      type: object
      required: [fact_id, account_id, instrument_id, venue, venue_environment, product, settlement_asset, amount]
      additionalProperties: false
      properties:
        payment_id: {type: string}
        fact_id: {type: string}
        supersedes_fact_id: {type: string}
        account_id: {type: string}
        instrument_id: {type: string}
        venue: {type: string}
        venue_environment: {type: string, enum: [demo, testnet, live]}
        product: {type: string}
        settlement_asset: {type: string}
        amount: {type: string, pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'}
        effective_at: {type: string, format: date-time}
        observed_at: {type: string, format: date-time}
        revision: {type: integer, minimum: 0}
        version: {type: string}
        source_ref: {type: string}
        formula_version: {type: string}
    FundingPaymentScope:
      type: object
      required: [account_id, all_instruments, start, end]
      additionalProperties: false
      properties:
        account_id: {type: string}
        instrument_id: {type: string}
        all_instruments: {type: boolean}
        settlement_asset: {type: string}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
    FundingPaymentTraversal:
      type: object
      required: [has_more_known, has_more]
      additionalProperties: false
      properties:
        cursor: {type: string}
        limit: {type: integer, minimum: 0, maximum: 500}
        has_more_known: {type: boolean}
        has_more: {type: boolean}
    FundingPaymentWatermark:
      type: object
      required: [revision, observed_at, verified]
      additionalProperties: false
      properties:
        cursor: {type: string}
        revision: {type: integer, minimum: 0}
        observed_at: {type: string, format: date-time}
        effective_through: {type: string, format: date-time}
        complete_through: {type: string, format: date-time}
        verified: {type: boolean}
    FundingPaymentPage:
      type: object
      required: [items, scope, account_id, pagination_traversal, start, end, page, watermark, status, as_of]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FundingPayment'}}
        next_cursor: {type: string}
        scope: {$ref: '#/components/schemas/FundingPaymentScope'}
        account_id: {type: string}
        instrument_id: {type: string}
        settlement_asset: {type: string}
        pagination_traversal: {$ref: '#/components/schemas/FundingPaymentTraversal'}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        page: {$ref: '#/components/schemas/PageInfo'}
        watermark: {$ref: '#/components/schemas/FundingPaymentWatermark'}
        status: {type: string, enum: [unsupported, temporarily_unavailable, incomplete, complete_empty, complete]}
        as_of: {type: string, format: date-time}
        complete_through: {type: string, format: date-time}
        revision: {type: integer, minimum: 0}
    PositionSnapshotResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: {$ref: '#/components/schemas/PositionSnapshot'}
    PositionSnapshot:
      type: object
      required: [account_id, freshness, verified_at, items]
      additionalProperties: false
      properties:
        account_id: {type: string}
        freshness: {type: string, enum: [syncing, live, delayed, stale, unavailable]}
        reason: {type: string}
        verified_at: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/ProjectedPosition'}
    ProjectedPosition:
      type: object
      required: [account_id, route_id, instrument_id, position_slot, position, resource_version, observed_at, verified_at]
      additionalProperties: false
      properties:
        account_id: {type: string}
        route_id: {type: string}
        instrument_id: {type: string}
        position_slot: {type: string, enum: [net, long, short]}
        position: {type: object, additionalProperties: true}
        resource_version: {type: integer, minimum: 1}
        observed_at: {type: string, format: date-time}
        verified_at: {type: string, format: date-time}
    PrivateEvent:
      type: object
      required: [event_id, account_id, resource_version, kind, occurred_at, payload]
      additionalProperties: false
      properties:
        event_id: {type: string}
        account_id: {type: string}
        resource_version: {type: integer, minimum: 1}
        kind: {type: string, enum: [order, fill, balance, position, account_connection]}
        occurred_at: {type: string, format: date-time}
        payload: {type: object, additionalProperties: true}
