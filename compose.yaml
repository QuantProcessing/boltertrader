# docker compose up -d --build --force-recreate
#
# The trader password is printed once in the trader log on first start:
#   docker compose logs trader | grep password
# Only 127.0.0.1:8080 is published. The gateway is reachable only inside the
# compose network. All state lives in the bolter-data volume.
#
# Venues behind a proxy: set BOLTER_PROXY, e.g. http://host.docker.internal:7892

x-common: &common
  image: boltertrader:latest
  build: .
  pull_policy: build
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  gateway:
    <<: *common
    entrypoint: ["/usr/local/bin/gateway"]
    environment:
      GATEWAY_ADDR: 0.0.0.0:8081
      GATEWAY_DATA_DIR: /data/gateway
      HTTPS_PROXY: ${BOLTER_PROXY:-}
      HTTP_PROXY: ${BOLTER_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,gateway,trader
    volumes:
      - bolter-data:/data
    networks: [internal]

  trader:
    <<: *common
    entrypoint: ["/usr/local/bin/trader"]
    depends_on: [gateway]
    environment:
      TRADER_ADDR: 0.0.0.0:8080
      TRADER_DATA_DIR: /data/trader
      GATEWAY_URL: http://gateway:8081
      GATEWAY_TOKEN_FILE: /data/gateway/token
    volumes:
      - bolter-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]

volumes:
  bolter-data:

networks:
  internal:
