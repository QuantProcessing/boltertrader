# libpq service definitions for the stack, as seen from inside the compose
# network. cmd/gateway-migrate connects by service name rather than DSN — it
# hard-codes `service=gateway_test` and refuses any other value — so this file is
# the only place the gateway migrator's host and port are written down.
#
# Mounted read-only at /etc/boltertrader/pg_service.conf and located through
# PGSERVICEFILE. The host is the compose service name, so this file is not usable
# from the host; `make doctor` and the migrate targets reach the published
# 127.0.0.1 port directly instead.
#
# No password appears here, and none is needed: the cluster runs under trust
# authentication on a port published only to loopback.

# The gateway migrator's identity. It deliberately carries no dbname —
# cmd/gateway-migrate appends `dbname=bolter_gateway_test` itself and then asserts
# current_database() matches, so a dbname here would be a second place for that
# fact to live and the wrong one to win.
[gateway_test]
host=postgres
port=5432
user=bolter_gateway_test_migrator
sslmode=disable

# The gateway's serving identity. Nothing in the stack connects through this
# entry — the gateway itself uses the DSN in GATEWAY_POSTGRES_DSN — but the
# authority acceptance test reads the runtime's effective privileges back through
# it, and doing that as the migrator would prove nothing about the runtime.
[gateway_runtime_test]
host=postgres
port=5432
user=bolter_gateway_test
dbname=bolter_gateway_test
sslmode=disable
